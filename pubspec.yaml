name: omni_profissionais_app
description: "Aplicativo Mobile Flutter do Projeto OMNI — Marketplace Inteligente de Profissionais, Prestadores de Serviços e Instituições"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Arquitetura e Gerenciamento de Estado
  provider: ^6.1.2

  # Comunicação com Backend PHP / WordPress AJAX Router
  http: ^1.2.1
  dio: ^5.4.3+1

  # Persistência Local e Armazenamento Seguro de Tokens
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Gestão Documental, Câmera e Seleção de Arquivos
  file_picker: ^8.0.3
  image_picker: ^1.1.0
  path_provider: ^2.1.3

  # Utilitários e Formatação de Dados
  intl: ^0.20.3
  uuid: ^4.4.0

  # Identidade Visual Dark Premium / Neon Luxuoso (#00FFCC)
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Gráficos de Performance e Financeiro
  fl_chart: ^0.68.0

  # Integração Mercado Pago e Pagamento Pix
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
